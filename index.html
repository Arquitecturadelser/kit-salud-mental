<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Kit</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .tab { display: none; }
        .active { display: block; }
        /* Add more styles as needed */
    </style>
</head>
<body>
    <h1>Mental Health Kit</h1>
    <div>
        <button onclick="openTab(event, 'breathing')">Breathing Exercise</button>
        <button onclick="openTab(event, 'emotions')">Emotion Check-In</button>
        <button onclick="openTab(event, 'techniques')">Techniques</button>
        <button onclick="openTab(event, 'quiz')">Self-Test Quiz</button>
    </div>

    <div id="breathing" class="tab">
        <h2>Breathing Exercises</h2>
        <!-- Breathing exercise content -->
        <button onclick="startBreathingExercise()">Start Exercise</button>
    </div>

    <div id="emotions" class="tab">
        <h2>Emotion Check-In</h2>
        <textarea id="emotionInput" placeholder="How are you feeling?"></textarea>
        <button onclick="submitEmotion()">Submit</button>
    </div>

    <div id="techniques" class="tab">
        <h2>Techniques</h2>
        <button onclick="toggleTechniques()">Show/Hide Techniques</button>
        <div id="techniquesList" style="display:none;">
            <p>Technique 1: ...</p>
            <p>Technique 2: ...</p>
        </div>
    </div>

    <div id="quiz" class="tab">
        <h2>Self-Test Quiz</h2>
        <!-- Quiz questions and options -->
        <button onclick="submitQuiz()">Submit Quiz</button>
    </div>

    <script>
        function openTab(evt, tabName) {
            const tabs = document.getElementsByClassName('tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].style.display = 'none';
            }
            document.getElementById(tabName).style.display = 'block';
        }

        function startBreathingExercise() {
            // Implement breathing exercise logic
            alert("Breathing exercise started!");
        }

        function submitEmotion() {
            const emotion = document.getElementById('emotionInput').value;
            alert(`You are feeling: ${emotion}`);
        }

        function toggleTechniques() {
            const techniquesList = document.getElementById('techniquesList');
            techniquesList.style.display = techniquesList.style.display === 'none' ? 'block' : 'none';
        }

        function submitQuiz() {
            // Implement quiz submission logic
            alert("Quiz submitted!");
        }
    </script>
</body>
</html>
